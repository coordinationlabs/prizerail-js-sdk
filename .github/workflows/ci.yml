name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The package supports Node 20.19+ and 22.12+, the first with require()
        # of ES modules, so test those floors as well as the latest.
        node: ["20.19.0", "22.12.0", 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      # CommonJS users load the ESM build through require(), so keep it loadable.
      - name: require()
        run: node -e 'require("./dist/index.js")'

      # An app that bundles the SDK into one file must not run the verify CLI
      # at startup, in ESM or CommonJS output. The SDK imports verify-core.mjs,
      # which the build cuts before the CLI.
      - name: Bundled app
        run: |
          if grep -q "prizerail:cli" dist/verify-core.mjs; then echo "verify-core.mjs has the CLI"; exit 1; fi
          echo 'import { Prizerail } from "./dist/index.js"; console.log(typeof Prizerail)' > bundle-app.mjs
          for format in esm cjs; do
            npx --yes esbuild@0.25.0 bundle-app.mjs --bundle --platform=node --format=$format --outfile=bundle-$format.js --log-level=error
            out="$(node bundle-$format.js)"
            test "$out" = "function" || { echo "$format bundle printed: $out"; exit 1; }
          done

      # The packed tarball is what npm users get, so check it has the CLI and the verify script.
      - name: Pack
        run: |
          npm pack --dry-run --json > pack.json
          for f in dist/index.js dist/cli.js dist/verify-core.mjs dist/verify-draw.mjs dist/verify-draw.d.mts README.md LICENSE; do
            jq -e --arg f "$f" '.[0].files | map(.path) | index($f)' pack.json > /dev/null || { echo "missing $f"; exit 1; }
          done
